
name: workstation-compose

services:
  web:
    build: .
    image: lab-nginx:compose
    ports:
      - "127.0.0.1:8091:80"
    restart: unless-stopped

  inspector:
    image: busybox:1.36
    depends_on:
      - web
    command:
      - sh
      - -c
      - "echo 'Inspector READY'; while true; do sleep 3600; done"
